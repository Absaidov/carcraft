name: mobile
#* Описание проекта
description: "Flutter проект для компании CarCraft"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.3
#* Зависимости для виджетов
dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_masked_text2: ^0.9.0
  lottie: ^3.1.0
  go_router: ^14.6.0
  logger: ^2.4.0
  shrink_sidemenu: ^2.0.0+2-null-safety
  circular_menu: ^4.0.0
  permission_handler: ^11.3.1
  icons_launcher: ^2.0.7
  provider: ^6.1.2
  postgres: ^2.4.0
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  carousel_slider: ^5.0.0

  # flutter_native_splash: ^2.2.16

#* Зависимости для написания тестов (покрытие тестами Flutter проекта)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.9.2
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13


flutter:
  uses-material-design: true
  assets:
    #* Данный ENV нужен был для прямой передачи данных в БД Postgresl
    #* БД находилась на Yandex Cloud
    # - .env
    #* Импорт анимированных GIF изображений для экрана ПРОДУКТЫ
    - assets/icons/
    - assets/icons/gif/momentum_pay.gif
    - assets/icons/gif/vin_by_vin.gif
    - assets/icons/gif/notarial_control.gif
    - assets/icons/gif/monitoring.gif
    - assets/icons/gif/smart_control.gif
    - assets/icons/gif/remoney.gif
    #* Импорт PNG изображений, для экрана НАША КОМАНДА
    - assets/icons/photo/111.png
    - assets/icons/photo/123.png
    - assets/icons/photo/555.png
    - assets/icons/photo/444.png
    - assets/icons/photo/666.png
    - assets/icons/photo/333.png
    # - assets/icons/green_logo.png
    #* Импорт JPG изображений, для экрана НОВОСТЕЙ
    - assets/images/Belenkiy_Boris.jpg
    - assets/images/Belenkiy_Boris2.jpg
    - assets/images/Belenkiy_Boris3.jpg
    - assets/images/ingostrah_carcraft.jpg
    - assets/images/dobro.jpg
    - assets/images/Boris_Dmitriev.jpg
    - assets/images/artem_nahaev.jpg
    - assets/images/medium_Daniel_d9ea9a1f3d.jpg
    - assets/images/medium_Gabeeva_203454a869.jpg
    - assets/images/medium_photo_2024_11_13_18_11_13_11e8ce96d9.jpg

    #* Импорт SVG изображений
    - assets/apped.svg
    - assets/apped_new.svg
    - assets/apped_new2.svg
    #* Импорт анимированных JSON изображений
    - assets/json/animated_speed.json
    - assets/json/animat.json
    #* Импорт сертификата для доступа к Yandex Cloud
    - assets/certs/RootCA.pem

    #* Данный ENV нужен был для прямой передачи данных в БД Postgresl
    #* БД находилась на Yandex Cloud
    - assets/config/.env

  fonts:
    - family: Microsoft
      fonts:
        - asset: assets/fonts/microsoftsansserif.ttf
          weight: 700
    - family: SF-Pro-Display
      fonts:
         - asset: assets/fonts/SF-Pro-Display/SF-Pro-Display-Heavy.otf
           weight: 700
#* Импорт PNG изображения для отображения иконки приложения           
icons_launcher:
  image_path: "assets/icons/carCraftLogo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

